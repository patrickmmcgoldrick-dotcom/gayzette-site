/* ---- Masthead ---- */
header.mast{border-bottom:4px double var(--ink-2);padding-bottom:.7rem;margin-bottom:.4rem}

.index-list a{display:flex;justify-content:space-between;gap:.5rem;padding:.18rem 0;text-decoration:none;border-bottom:1px dotted var(--rule)}
.index-list a:hover{color:var(--stamp)}

/* ---- Editor's note ---- */
.ednote{margin:1.3rem 0 1.2rem;padding:0 0 1.3rem;border-bottom:1px solid var(--rule)}

/* ---- Section / column layout ---- */
.beat-head{font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:2.4rem 0 0;padding:.45rem 0;border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:.55rem}

.cols{display:grid;grid-template-columns:1fr;gap:0 2.1rem}
@media(min-width:640px){.cols.cols-2{grid-template-columns:1fr 1fr}}

.cols .col{min-width:0}
.cols.cols-2 .col:first-child,.cols.cols-3 .col:not(:last-child){border-right:0}

.story{padding:1.5rem 0 1.2rem;border-bottom:1px solid var(--rule)}

.react button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.calendar ul{list-style:none;margin:1rem 0 0;padding:0}

/* ---- How it's made ---- */
.made p{margin:.85rem 0}
.tablewrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:32rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}

td:nth-child(2){font-family:var(--mono);font-size:.78rem;white-space:nowrap}

.intro{margin:1rem 0 0;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.site-banner{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-align:center;padding:.4rem 1rem;background:var(--paper-2);color:var(--ink-2);border-bottom:1px solid var(--rule-2)}.site-foot{max-width:60rem;margin:2rem auto 2.5rem;padding:1rem 1rem 0;border-top:1px solid var(--rule-2);font-family:var(--mono);font-size:.7rem;line-height:1.7;color:var(--ink-3);text-align:center}.site-foot a{color:inherit}</style></head><body>
